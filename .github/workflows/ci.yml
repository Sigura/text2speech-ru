name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: scripts/export-requirements.sh --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=text2audio --cov-report=term-missing

  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Ubuntu 24.04 blocks unprivileged user namespaces by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: T2A_OFFLINE_STRICT=1 scripts/test-offline.sh
