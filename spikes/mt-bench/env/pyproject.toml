[project]
name = "mt-bench"
version = "0"
description = "Throwaway spike env: offline ru→en machine translation benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "transformers==4.57.6",
    "accelerate",
    "sentencepiece==0.2.2",
    "sacremoses==0.1.1",
    "protobuf",
    "sacrebleu",
    "unbabel-comet",
    "huggingface-hub",
    "setuptools<81",  # COMET imports pkg_resources
]

[tool.uv]
package = false
