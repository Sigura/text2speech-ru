[project]
name = "text2audio-cover-sd-webui"
version = "0.1.0"
description = "Cover generator driving its own local AUTOMATIC1111 Stable Diffusion WebUI (§6.8.2)"
requires-python = ">=3.11"
# Standard library HTTP client; the WebUI runs in its own environment ([cover.sd] dir).
dependencies = ["text2audio"]

[project.entry-points."text2audio.covers"]
sd-webui = "text2audio_cover_sd_webui.generator:SdWebUI"

[tool.uv.sources]
text2audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2audio_cover_sd_webui"]
