[project]
name = "text2audio-tagger-wd14"
version = "0.1.0"
description = "WD14 image tagger (SmilingWolf wd-swinv2-tagger-v3, ONNX) for cover repaint prompts (own uv environment)"
requires-python = ">=3.11"
# The descriptor imports text2audio; the worker runs in env/ and uses no core code.
dependencies = ["text2audio"]

[project.entry-points."text2audio.taggers"]
wd14 = "text2audio_tagger_wd14.descriptor:Wd14Tagger"

[tool.uv.sources]
text2audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2audio_tagger_wd14"]
