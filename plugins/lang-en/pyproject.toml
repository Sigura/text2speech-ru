[project]
name = "text2audio-lang-en"
version = "0.1.0"
description = "English language pack for text2audio: text structure, normalization, voices"
requires-python = ">=3.11"
# Pure-Python text rules only; models run as workers in their own environments (ADR-0004).
dependencies = ["text2audio"]

[project.entry-points."text2audio.languages"]
en = "text2audio_lang_en:PROFILE"

[project.entry-points."text2audio.normalizers"]
en = "text2audio_lang_en.normalize:Normalizer"

[tool.uv.sources]
text2audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2audio_lang_en"]
