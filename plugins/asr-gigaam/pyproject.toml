[project]
name = "text2audio-asr-gigaam"
version = "0.1.0"
description = "GigaAM-v3 RNN-T speech recognition for the text2audio QA gate (Russian; own uv environment)"
requires-python = ">=3.11"
# The descriptor imports text2audio; the worker runs in env/ and uses no core code.
dependencies = ["text2audio"]

[project.entry-points."text2audio.asr"]
gigaam = "text2audio_asr_gigaam.descriptor:GigaAM"

[tool.uv.sources]
text2audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2audio_asr_gigaam"]
