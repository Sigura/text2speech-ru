[project]
name = "text2audio-mt-opus"
version = "0.1.0"
description = "Opus-MT (Marian) machine translation into English for cover prompts (own uv environment)"
requires-python = ">=3.11"
# The descriptor imports text2audio; the worker runs in env/ and uses no core code.
dependencies = ["text2audio"]

[project.entry-points."text2audio.translators"]
opus-mt-ru-en = "text2audio_mt_opus.descriptor:OpusMtRuEn"

[tool.uv.sources]
text2audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2audio_mt_opus"]
