[project]
name = "text2audio-backend-chatterbox"
version = "0.1.0"
description = "Chatterbox Multilingual TTS and voice conversion for text2audio (expressive tier; own uv environment)"
requires-python = ">=3.11"
# The descriptor imports text2audio; the worker runs in env/ and uses no core code.
dependencies = ["text2audio"]

# One descriptor, one worker: TTS for segments with foreign words, VC as the polisher.
[project.entry-points."text2audio.backends"]
chatterbox = "text2audio_backend_chatterbox.descriptor:ChatterboxBackend"

[project.entry-points."text2audio.polishers"]
chatterbox = "text2audio_backend_chatterbox.descriptor:ChatterboxBackend"

[tool.uv.sources]
text2audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2audio_backend_chatterbox"]
