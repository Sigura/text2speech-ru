[project]
name = "text2audio-backend-silero"
version = "0.1.0"
description = "Silero TTS v5 backend for text2audio (Russian fast tier; runs in its own uv environment)"
requires-python = ">=3.11"
# The descriptor imports text2audio; the worker runs in env/ and uses no core code.
dependencies = ["text2audio"]

[project.entry-points."text2audio.backends"]
silero = "text2audio_backend_silero.descriptor:SileroBackend"

[tool.uv.sources]
text2audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2audio_backend_silero"]
