[project]
name = "t2a-env-backend-silero"
version = "0"
description = "Worker environment of the Silero backend (not installed as a package)"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.14.1", "numpy==2.5.4", "soundfile==0.14.0"]

[tool.uv]
package = false

# CPU wheels: Silero runs on CPU slots only, and they are a fraction of the CUDA size.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
