# Conda environment for text2audio (alternative to uv; uv.lock stays the source of truth).
#
#   conda env create -f environment.yaml     # run from the repository root
#   conda activate text2audio
#   text2audio models pull --lang ru         # pinned weights (what install.sh does)
#   text2audio doctor
#
# Conda supplies Python and FFmpeg; espeak-ng comes from the system
# (`sudo apt install espeak-ng`). pip installs the locked Python packages exported
# from uv.lock. TTS backends are NOT installed here: each runs in its own
# environment (ADR-0004).
name: text2audio
channels:
  - conda-forge
dependencies:
  - python=3.11
  - ffmpeg>=6
  - pip
  - pip:
      - -r requirements-dev.txt
