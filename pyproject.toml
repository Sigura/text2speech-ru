[project]
name = "text2audio"
version = "0.1.0.dev0"
description = "Offline, multi-language document-to-audiobook pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    # Imported lazily, only by `text2audio models pull` (the sole network path, §6.10).
    "huggingface-hub>=0.24",
    "defusedxml>=0.7",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "charset-normalizer>=3.3",
    "pysbd>=0.3.4",
]

[project.scripts]
text2audio = "text2audio.cli:main"

[dependency-groups]
dev = [
    "text2audio-backend-sine",
    "pytest>=8",
    "pytest-socket>=0.7",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.uv.workspace]
members = ["plugins/*"]
exclude = ["spikes/*"]

[tool.uv.sources]
text2audio-backend-sine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test run is socket-free (FR-04, §12); worker pipes are not sockets.
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["spikes", "*.md"]  # ruff would reformat code blocks in the docs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Russian text is full of «», — and ё; "ambiguous Unicode" warnings are noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
